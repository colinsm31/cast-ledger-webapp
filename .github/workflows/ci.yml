# Lint, typecheck/build and unit-test the web app on every push and pull request.
name: Web CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code (code review #43).
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
